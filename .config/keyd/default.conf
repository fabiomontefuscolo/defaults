# keyd — system-level keyboard remapping (Karabiner equivalent)
# Source of truth: ~/devel/defaults/.config/keyd/default.conf
# Activated via: sudo ln -s ~/.config/keyd/default.conf /etc/keyd/default.conf
#
# Caps Lock becomes a navigation-layer key (Karabiner: caps_lock -> fn).
# macOS semantics translated to Linux: word-jump = Ctrl+arrows (was Option),
# line start/end = Home/End (was Cmd+arrows).
#
# NOTE: keyd has no inline comments and no chord bindings on the left side;
# modifier combos inside a layer use composite layers: [nav:C], [nav:S], ...

# keyd — system-level keyboard remapping (Karabiner equivalent)
# Source of truth: ~/devel/defaults/.config/keyd/default.conf
# Activated via: sudo ln -s ~/.config/keyd/default.conf /etc/keyd/default.conf
#
# Caps Lock becomes a navigation-layer key (Karabiner: caps_lock -> fn).
# macOS semantics translated to Linux: word-jump = Ctrl+arrows (was Option),
# line start/end = Home/End (was Cmd+arrows).

[ids]
*

[main]
capslock = layer(nav)

# caps + key
[nav]
h = left
j = down
k = up
l = right
d = C-d
a = home
e = end
w = C-right
b = C-left
x = delete

# caps + ctrl + key
[nav+control]
u = pageup
d = pagedown
w = C-backspace
j = enter
k = macro(S-end backspace)

# caps + alt + key
[nav+alt]
d = macro(C-S-right backspace)

# caps + shift + key
[nav+shift]
w = C-S-right
b = C-S-left
a = S-home
e = S-end

